<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUOJ - 用户登录</title>
    <link rel="stylesheet" href="/account/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1><i class="fas fa-sign-in-alt"></i> AUOJ 用户登录</h1>
            <p class="subtitle">访问您的JSON存储账户</p>
        </header>

        <div class="form-container">
            <div class="form-header">
                <h2><i class="fas fa-key"></i> 用户登录</h2>
                <p>请输入您的用户名和密码</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="loginUsername">
                        <i class="fas fa-user"></i> 用户名
                    </label>
                    <input type="text" id="loginUsername" 
                           placeholder="请输入用户名" required>
                </div>

                <div class="form-group">
                    <label for="loginPassword">
                        <i class="fas fa-lock"></i> 密码
                    </label>
                    <input type="password" id="loginPassword" 
                           placeholder="请输入密码" required>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" id="loginBtn">
                        <i class="fas fa-sign-in-alt"></i> 立即登录
                    </button>
                    <button type="button" class="btn btn-outline" onclick="window.location.href='index.html'">
                        <i class="fas fa-user-plus"></i> 没有账户？立即注册
                    </button>
                </div>
            </form>

            <div id="loginResult" class="result-container" style="display: none;">
                <div id="loginResultContent"></div>
                <button class="btn btn-outline" onclick="hideLoginResult()" style="margin-top: 10px; padding: 8px 15px; font-size: 14px;">
                    <i class="fas fa-times"></i> 关闭
                </button>
            </div>
        </div>

        <footer class="footer">
            <p class="copyright">© 2026 AUOJ JSON存储API | <a href="/account/register">返回注册页面</a></p>
        </footer>
    </div>

    <script>
        // API 配置
        const API_BASE_URL = 'https://auoj.mvmzf.cn:800/';

        // 【核心算法】自定义纯数字加密算法 (对应 Python 的 hash 函数)
        function customHash(str) {
            let ans = 0;
            for (let i = 0; i < str.length; i++) {
                // 累加的字符 ASCII 码
                const add = str.charCodeAt(i); // 对应 Python 的 ord(string[i])

                // 不同处理
                if (add % 3 === 0) {
                    ans += add * (i + 1) * 7;
                } else if (add % 2 === 1) { // 奇数
                    ans += add * (i + 1) * 2;
                } else {
                    ans += add * (i + 1) * 5;
                }
            }
            
            return ans; // 返回纯数字
        }

        // 获取用户数据（用于检查封禁状态）
        async function getUserData(username) {
            try {
                const response = await fetch(`${API_BASE_URL}/get?id=${encodeURIComponent(username)}`);
                const result = await response.json();
                if (result.success) {
                    return result.data;
                }
                return null;
            } catch (error) {
                console.error('获取用户数据失败:', error);
                return null;
            }
        }

        // 检查用户是否被封禁
        function isBanned(userData) {
            if (!userData) return false;
            
            // 检查封禁状态
            if (userData.ban === true || userData.ban === 'true') {
                // 如果是永久封禁
                if (userData.bantime === true || userData.bantime === 'true') {
                    return {
                        banned: true,
                        reason: '永久封禁',
                        detail: userData.banreason || '原因未知'
                    };
                }
                
                // 如果是临时封禁，检查时间是否过期
                if (userData.bantime) {
                    const banTime = new Date(userData.bantime);
                    const now = new Date();
                    
                    if (now < banTime) {
                        return {
                            banned: true,
                            reason: '临时封禁',
                            detail: `封禁至 ${banTime.toLocaleString('zh-CN')}，原因：${userData.banreason || '原因未知'}`
                        };
                    }
                }
            }
            
            return { banned: false };
        }

        // 显示登录结果
        function showLoginResult(message, isSuccess = true) {
            const resultContainer = document.getElementById('loginResult');
            const resultContent = document.getElementById('loginResultContent');
            
            resultContainer.style.display = 'block';
            resultContent.innerHTML = `
                <div class="result-item ${isSuccess ? 'success' : 'error'}">
                    <i class="fas ${isSuccess ? 'fa-check-circle' : 'fa-times-circle'}"></i>
                    <span>${message}</span>
                </div>
            `;
        }

        // 隐藏登录结果
        function hideLoginResult() {
            document.getElementById('loginResult').style.display = 'none';
        }

        // 登录表单提交处理
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const loginBtn = document.getElementById('loginBtn');
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            
            if (!username || !password) {
                showLoginResult('请输入用户名和密码', false);
                return;
            }
            
            // 禁用登录按钮，防止重复提交
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 登录中...';
            
            try {
                // 1. 检查用户是否存在
                const userData = await getUserData(username);
                if (!userData) {
                    showLoginResult('用户不存在', false);
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> 立即登录';
                    return;
                }
                
                // 2. 检查用户是否被封禁
                const banStatus = isBanned(userData);
                if (banStatus.banned) {
                    showLoginResult(`登录失败：该账号已被${banStatus.reason}，${banStatus.detail}`, false);
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> 立即登录';
                    return;
                }
                
                // 3. 使用自定义算法生成纯数字加密密码
                const hashedPassword = customHash(password);
                console.log('原始密码:', password);
                console.log('加密后的密码:', hashedPassword); // 调试用
                
                // 4. 调用 /token 端点验证登录
                // URL 格式: https://auoj.mvmzf.cn:800/token?id=(用户名)&pw=(纯数字加密密码)
                const tokenUrl = `${API_BASE_URL}/token?id=${encodeURIComponent(username)}&pw=${encodeURIComponent(hashedPassword)}`;
                const response = await fetch(tokenUrl);
                const result = await response.json();
                
                if (result.success && result.token) {
                    // 5. 登录成功，跳转到自定义协议
                    showLoginResult('登录成功！正在跳转...', true);
                    
                    setTimeout(() => {
                        // 跳转到自定义协议，传递用户名和原始密码
                        window.open(`auscoj://login?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`);
                    }, 1000);
                } else {
                    showLoginResult('用户名或密码错误', false);
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> 立即登录';
                }
                
            } catch (error) {
                console.error('登录失败:', error);
                showLoginResult('登录失败，请稍后重试', false);
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> 立即登录';
            }
        });
    </script>
</body>
</html>
