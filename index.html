<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Among Us Scratch OJ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0a0e1a 0%, #1a1f35 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }
        
        .container {
            text-align: center;
            max-width: 800px;
            padding: 3rem 2rem;
            position: relative;
            z-index: 2;
        }
        
        .title-container {
            margin-bottom: 3rem;
        }
        
        h1 {
            font-size: 4rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            letter-spacing: -1px;
            line-height: 1.1;
        }
        
        .title-gradient {
            background: linear-gradient(90deg, #ff4655 0%, #4361ee 50%, #00f5d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle {
            font-size: 1.4rem;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 300;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }
        
        .download-section {
            margin-top: 3rem;
        }
        
        .buttons-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        
        .download-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: linear-gradient(135deg, #4361ee 0%, #3a0ca3 100%);
            color: white;
            font-size: 1.3rem;
            font-weight: 600;
            padding: 1.2rem 3rem;
            border-radius: 14px;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 30px rgba(67, 97, 238, 0.3);
            border: none;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            width: 100%;
            max-width: 350px;
        }
        
        .download-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(67, 97, 238, 0.5);
            background: linear-gradient(135deg, #4a6eff 0%, #4a0fb5 100%);
        }
        
        .download-btn:active {
            transform: translateY(0);
        }
        
        .web-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, #ff4655 0%, #c51111 100%);
            color: white;
            font-size: 1.1rem;
            font-weight: 500;
            padding: 1rem 2.5rem;
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: none;
            cursor: pointer;
            width: 100%;
            max-width: 350px;
            box-shadow: 0 6px 20px rgba(255, 70, 85, 0.3);
        }
        
        .web-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(255, 70, 85, 0.5);
            background: linear-gradient(135deg, #ff5c6a 0%, #d52121 100%);
        }
        
        .web-btn:active {
            transform: translateY(0);
        }
        
        .tutorial-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.9rem;
            font-weight: 500;
            padding: 0.7rem 1.8rem;
            border-radius: 10px;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            width: 100%;
            max-width: 280px;
            margin-top: 0.5rem;
        }
        
        .tutorial-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }
        
        .tutorial-btn:active {
            transform: translateY(0);
        }
        
        .download-btn i, .web-btn i, .tutorial-btn i {
            font-size: 1.2em;
            transition: transform 0.3s ease;
        }
        
        .download-btn:hover i {
            transform: translateY(2px);
        }
        
        .web-btn:hover i {
            transform: translateY(1px);
        }
        
        .tutorial-btn:hover i {
            transform: translateY(1px);
        }
        
        .btn-pulse {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.1);
            opacity: 0;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 0.7;
            }
            100% {
                transform: scale(1.1);
                opacity: 0;
            }
        }
        
        .version-info {
            margin-top: 1.5rem;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
        }
        
        /* 装饰元素 */
        .decoration {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
            pointer-events: none;
        }
        
        .floating-shape {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(67, 97, 238, 0.1), rgba(255, 70, 85, 0.1));
            filter: blur(20px);
        }
        
        .shape-1 {
            width: 300px;
            height: 300px;
            top: 10%;
            right: 10%;
            animation: float 20s infinite ease-in-out;
        }
        
        .shape-2 {
            width: 200px;
            height: 200px;
            bottom: 15%;
            left: 10%;
            animation: float 25s infinite ease-in-out reverse;
        }
        
        .shape-3 {
            width: 150px;
            height: 150px;
            top: 50%;
            left: 5%;
            animation: float 18s infinite ease-in-out;
        }
        
        @keyframes float {
            0%, 100% {
                transform: translate(0, 0) rotate(0deg);
            }
            33% {
                transform: translate(30px, -50px) rotate(120deg);
            }
            66% {
                transform: translate(-20px, 20px) rotate(240deg);
            }
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            h1 {
                font-size: 2.8rem;
            }
            
            .subtitle {
                font-size: 1.2rem;
                padding: 0 1rem;
            }
            
            .download-btn {
                font-size: 1.1rem;
                padding: 1rem 2.5rem;
            }
            
            .web-btn {
                font-size: 1rem;
                padding: 0.9rem 2rem;
            }
            
            .tutorial-btn {
                font-size: 0.85rem;
                padding: 0.65rem 1.6rem;
                max-width: 250px;
            }
            
            .container {
                padding: 2rem 1.5rem;
            }
        }
        
        @media (max-width: 480px) {
            h1 {
                font-size: 2.2rem;
            }
            
            .subtitle {
                font-size: 1rem;
            }
            
            .download-btn {
                font-size: 1rem;
                padding: 0.9rem 2rem;
                flex-direction: column;
                gap: 8px;
            }
            
            .web-btn {
                font-size: 0.9rem;
                padding: 0.8rem 1.8rem;
                flex-direction: column;
                gap: 6px;
            }
            
            .tutorial-btn {
                font-size: 0.8rem;
                padding: 0.6rem 1.4rem;
                flex-direction: column;
                gap: 5px;
                max-width: 220px;
            }
            
            .download-btn i, .web-btn i, .tutorial-btn i {
                font-size: 1.4em;
            }
        }
        
        /* 加载动画 */
        .loading-dots {
            display: none;
            gap: 8px;
            margin-top: 1rem;
            justify-content: center;
        }
        
        .loading-dots span {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4361ee;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        
        .loading-dots span:nth-child(1) {
            animation-delay: -0.32s;
        }
        
        .loading-dots span:nth-child(2) {
            animation-delay: -0.16s;
        }
        
        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0);
            }
            40% {
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
    <!-- 背景装饰 -->
    <div class="decoration">
        <div class="floating-shape shape-1"></div>
        <div class="floating-shape shape-2"></div>
        <div class="floating-shape shape-3"></div>
    </div>
    
    <!-- 主内容 -->
    <div class="container">
        <div class="title-container">
            <h1><span class="title-gradient">Among Us Scratch OJ</span></h1>
            <p class="subtitle">使用 Scratch 复刻的 Among Us</p>
        </div>
        
        <div class="download-section">
            <div class="buttons-container">
                <a href=".download" class="download-btn" id="downloadBtn">
                    <span class="btn-pulse"></span>
                    <i class="fas fa-download"></i>
                    立即下载(稳定版)
                </a>
                
                <a href="https://auoj.ytt11.xyz/jump-to/onlineplay" class="web-btn" id="webBtn" target="_blank">
                    <i class="fas fa-globe"></i>
                    进入网页版(Beta测试中)
                </a>
                
                <a href="https://auoj.ytt11.xyz/jump-to/auoj_blog" class="tutorial-btn" id="tutorialBtn" target="_blank">
                    <i class="fas fa-book"></i>
                    IDM一直自动嗅探资源？点击查看解决办法
                </a>
            </div>
            
            <div class="loading-dots" id="loadingDots">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const downloadBtn = document.getElementById('downloadBtn');
            const webBtn = document.getElementById('webBtn');
            const tutorialBtn = document.getElementById('tutorialBtn');
            const loadingDots = document.getElementById('loadingDots');
            
            // 点击下载按钮
            downloadBtn.addEventListener('click', function(e) {
                e.preventDefault();
                
                // 显示加载动画
                downloadBtn.style.opacity = '0.8';
                downloadBtn.style.pointerEvents = 'none';
                webBtn.style.opacity = '0.8';
                webBtn.style.pointerEvents = 'none';
                tutorialBtn.style.opacity = '0.8';
                tutorialBtn.style.pointerEvents = 'none';
                loadingDots.style.display = 'flex';
                
                // 模拟下载过程
                setTimeout(() => {
                    // 在实际应用中，这里应该跳转到下载页面
                    window.location.href = './download';
                    
                    // 恢复按钮状态（如果跳转失败）
                    setTimeout(() => {
                        downloadBtn.style.opacity = '1';
                        downloadBtn.style.pointerEvents = 'auto';
                        webBtn.style.opacity = '1';
                        webBtn.style.pointerEvents = 'auto';
                        tutorialBtn.style.opacity = '1';
                        tutorialBtn.style.pointerEvents = 'auto';
                        loadingDots.style.display = 'none';
                    }, 3000);
                }, 1500);
            });
            
            // 点击网页版按钮
            webBtn.addEventListener('click', function(e) {
                // 添加点击反馈
                this.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    this.style.transform = '';
                }, 150);
                
                // 在新标签页中打开网页版（target="_blank"已设置）
                console.log('正在打开网页版: http://auoj.mvmzf.cn:4433/');
            });
            
            // 点击教程按钮
            tutorialBtn.addEventListener('click', function(e) {
                // 添加点击反馈
                this.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    this.style.transform = '';
                }, 150);
                
                // 在新标签页中打开教程（target="_blank"已设置）
                console.log('正在打开教程: https://auoj.ytt11.xyz/jump-to/auoj_blog');
            });
            
            // 添加键盘支持
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    downloadBtn.focus();
                }
                
                if (e.key === 'Enter' && document.activeElement === downloadBtn) {
                    downloadBtn.click();
                }
                
                // 按W键聚焦网页版按钮
                if (e.key === 'w' || e.key === 'W') {
                    webBtn.focus();
                    e.preventDefault();
                }
                
                // 按T键聚焦教程按钮
                if (e.key === 't' || e.key === 'T') {
                    tutorialBtn.focus();
                    e.preventDefault();
                }
                
                // 按Enter键在网页版按钮上时
                if (e.key === 'Enter' && document.activeElement === webBtn) {
                    // 按钮的="_blank"会在新标签页打开
                }
                
                // 按Enter键在教程按钮上时
                if (e.key === 'Enter' && document.activeElement === tutorialBtn) {
                    // 按钮的="_blank"会在新标签页打开
                }
            });
            
            // 装饰元素动画增强
            const shapes = document.querySelectorAll('.floating-shape');
            shapes.forEach(shape => {
                // 随机动画参数
                const duration = Math.random() * 15 + 20;
                shape.style.animationDuration = `${duration}s`;
            });
        });
    </script>
</body>
</html>
